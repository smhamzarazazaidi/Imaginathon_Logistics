<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver App - Gwadar Cargo Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/driver.css">
</head>
<body>
    <div id="app">
        <div class="driver-app">
            <div class="driver-header">
                <h1>Good afternoon, Ahmed</h1>
            </div>
            <div class="active-journey">
                <h2>ACTIVE JOURNEY</h2>
                <div class="journey-route">
                    <div class="route-point completed">
                        <span class="point-name">Gwadar</span>
                        <span class="point-check">✓</span>
                        <div class="route-line"></div>
                    </div>
                    <div class="route-point completed">
                        <span class="point-name">CP-01</span>
                        <span class="point-check">✓</span>
                        <div class="route-line"></div>
                    </div>
                    <div class="route-point current">
                        <span class="point-name">CP-02</span>
                        <div class="route-line"></div>
                    </div>
                    <div class="route-point">
                        <span class="point-name">CP-03</span>
                        <div class="route-line"></div>
                    </div>
                    <div class="route-point">
                        <span class="point-name">Quetta</span>
                    </div>
                </div>
                <div class="journey-info">
                    <p>Cargo: GWD-001284</p>
                    <p>Truck: BLA-2045</p>
                    <p>ETA: 18:30</p>
                </div>
                <div class="journey-actions">
                    <button class="action-btn">Show Cargo QR</button>
                    <button class="action-btn">View Route</button>
                    <button class="action-btn">Documents</button>
                    <button class="action-btn">Report Problem</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/main.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/pages/driver/mobile-app.js"></script>
</body>
</html>
